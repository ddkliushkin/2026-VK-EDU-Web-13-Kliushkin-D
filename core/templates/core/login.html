{% extends 'core/base.html' %}

{% block title %}Вход в аккаунт — Voprosik{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h1 class="h3 mb-4">Вход</h1>

        <form action="{% url 'index' %}" method="post" novalidate style="max-width: 540px;">
            {% csrf_token %}
            <div class="row mb-3">
                <label for="loginInput" class="col-sm-4 col-form-label fw-semibold">Логин или Email</label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" id="loginInput" maxlength="64" placeholder="Введите ваш логин" required>
                    <div class="form-text">До 64 символов (латиница, цифры или email).</div>
                </div>
            </div>

            <div class="row mb-4">
                <label for="passwordInput" class="col-sm-4 col-form-label fw-semibold">Пароль</label>
                <div class="col-sm-8">
                    <input type="password" class="form-control" id="passwordInput" maxlength="64" placeholder="••••••••" required>
                    <div class="form-text">Пароль чувствителен к регистру символов.</div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-8 offset-sm-4 d-flex flex-column gap-3">
                    <div>
                        <button type="submit" class="btn btn-primary px-4">Войти</button>
                    </div>
                    <div>
                        <span class="text-muted small">Еще нет аккаунта?</span>
                        <a href="{% url 'signup' %}" class="small fw-semibold text-decoration-none ms-1">Создать новый аккаунт</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
