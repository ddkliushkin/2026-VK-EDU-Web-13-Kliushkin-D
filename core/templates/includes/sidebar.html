<div class="p-3 bg-white border rounded-3 shadow-sm mb-4">
    <h2 class="h5 mb-3">Популярные теги</h2>
    <div class="d-flex flex-wrap gap-2">
        {% for t in popular_tags %}
            <a href="{{ t.get_absolute_url }}" class="badge {% cycle 'text-bg-primary' 'text-bg-success' 'text-bg-danger' 'text-bg-warning' 'text-bg-info' 'text-bg-secondary' 'text-bg-dark' %} text-decoration-none fs-6">#{{ t.name }}</a>
        {% empty %}
            <span class="text-muted small">Тегов пока нет.</span>
        {% endfor %}
    </div>
</div>

<div class="p-3 bg-white border rounded-3 shadow-sm">
    <h2 class="h5 mb-3">Лучшие участники</h2>
    <ul class="list-unstyled mb-0 d-flex flex-column gap-2">
        {% for member in best_members %}
            <li><a href="{% url 'profile' %}" class="text-decoration-none">{{ member.username }}</a></li>
        {% empty %}
            <li class="text-muted small">Участников пока нет.</li>
        {% endfor %}
    </ul>
</div>
